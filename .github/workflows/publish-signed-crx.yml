name: Publish Signed Chromium CRX

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Pure Chromium ZIP"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish-signed-crx:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version and verify fixed extension ID
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < browser-extension/ZIP_VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          EXTENSION_ID=$(node browser-extension/tests/signed-update.test.cjs | sed -n 's/^signed update ID: //p')
          test "$EXTENSION_ID" = "hlfnagdelcpfdbpdeackdjelemaaoban"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "extension_id=$EXTENSION_ID" >> "$GITHUB_OUTPUT"
          echo "tag=browser-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate stable core before signing
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find browser-extension -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
          for test in browser-extension/tests/*.test.cjs; do node "$test"; done
          rm -rf build/chromium-signed dist
          mkdir -p dist
          python browser-extension/tools/build-signed-crx-dir.py build/chromium-signed
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/chromium-signed")
          m = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          version = Path("browser-extension/ZIP_VERSION").read_text().strip()
          assert m["version"] == version
          assert m["background"]["service_worker"] == "background/main-zip.js"
          assert m["update_url"] == "https://raw.githubusercontent.com/dulo11/fanyi2/extension-update-channel/updates.xml"
          js = m["content_scripts"][0]["js"]
          assert "content/content.js" in js
          assert "content/floating-panel-simple.js" in js
          assert "content/content-fast.js" not in js
          assert "shared/storage-rpc-client.js" not in js
          PY

      - name: Require signing key secret
        shell: bash
        env:
          FT_CRX_PRIVATE_KEY_B64: ${{ secrets.FT_CRX_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${FT_CRX_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::Missing repository secret FT_CRX_PRIVATE_KEY_B64."
            exit 1
          fi
          printf '%s' "$FT_CRX_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/FloatingTranslator-private.pem"
          chmod 600 "$RUNNER_TEMP/FloatingTranslator-private.pem"
          openssl rsa -in "$RUNNER_TEMP/FloatingTranslator-private.pem" -check -noout
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const pem = fs.readFileSync(process.env.RUNNER_TEMP + '/FloatingTranslator-private.pem');
          const publicDer = crypto.createPublicKey(pem).export({ type: 'spki', format: 'der' });
          const expected = Buffer.from(require('./browser-extension/manifest.json').key, 'base64');
          if (!publicDer.equals(expected)) throw new Error('Signing key does not match the existing extension ID');
          JS

      - name: Install CRX3 packer
        shell: bash
        run: npm install --global --omit=dev crx3@2.0.0

      - name: Build fixed-signature CRX3
        shell: bash
        run: |
          set -euo pipefail
          crx3 -p "$RUNNER_TEMP/FloatingTranslator-private.pem" \
            -o dist/FloatingTranslator-Chromium.crx \
            build/chromium-signed
          test -s dist/FloatingTranslator-Chromium.crx

      - name: Generate update manifest and CRX checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          EXTENSION_ID='${{ steps.meta.outputs.extension_id }}'
          cat > dist/updates.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">
            <app appid="${EXTENSION_ID}">
              <updatecheck codebase="https://github.com/dulo11/fanyi2/releases/download/browser-v${VERSION}/FloatingTranslator-Chromium.crx" version="${VERSION}" />
            </app>
          </gupdate>
          XML
          (cd dist && sha256sum FloatingTranslator-Chromium.crx > "SHA256SUMS-CRX-v${VERSION}.txt")

      - name: Add CRX assets without replacing ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          TAG='${{ steps.meta.outputs.tag }}'
          SUM="dist/SHA256SUMS-CRX-v${VERSION}.txt"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Stable ZIP release $TAG does not exist. Publish ZIP first."
            exit 1
          fi
          gh release upload "$TAG" \
            dist/FloatingTranslator-Chromium.crx \
            dist/updates.xml \
            "$SUM" \
            --clobber

      - name: Publish static update channel XML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin extension-update-channel
          rm -rf /tmp/ft-update-channel
          git worktree add --detach /tmp/ft-update-channel origin/extension-update-channel
          cp dist/updates.xml /tmp/ft-update-channel/updates.xml
          cd /tmp/ft-update-channel
          git add updates.xml
          if git diff --cached --quiet; then
            echo "updates.xml already current"
          else
            git commit -m "release(update): 浮译 v${{ steps.meta.outputs.version }}"
            git push origin HEAD:extension-update-channel
          fi

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/FloatingTranslator-private.pem"

      - name: Upload signed CRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-Signed-Chromium-v${{ steps.meta.outputs.version }}
          path: |
            dist/FloatingTranslator-Chromium.crx
            dist/updates.xml
            dist/SHA256SUMS-CRX-v${{ steps.meta.outputs.version }}.txt
          if-no-files-found: error
          retention-days: 30
