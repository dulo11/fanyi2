name: Refresh v1.3.5 Checksums

on:
  push:
    paths:
      - '.github/workflows/refresh-v135-checksums.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current Release assets and regenerate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -L --fail --retry 3 \
            'https://github.com/dulo11/fanyi2/releases/download/browser-v1.3.5/FloatingTranslator-Chromium.crx' \
            -o dist/FloatingTranslator-Chromium.crx
          curl -L --fail --retry 3 \
            'https://github.com/dulo11/fanyi2/releases/download/browser-v1.3.5/FloatingTranslator-Chromium-v1.3.5.zip' \
            -o dist/FloatingTranslator-Chromium-v1.3.5.zip
          unzip -p dist/FloatingTranslator-Chromium-v1.3.5.zip manifest.json | grep -F 'https://raw.githubusercontent.com/dulo11/fanyi2/extension-update-channel/updates.xml'
          (cd dist && sha256sum FloatingTranslator-Chromium.crx FloatingTranslator-Chromium-v1.3.5.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Replace checksum asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload browser-v1.3.5 dist/SHA256SUMS.txt --clobber
