name: Migrate Browser Project

on:
  push:
    paths:
      - '.github/workflows/migrate-browser-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Download browser project from legacy repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fanyi-source /tmp/fanyi-source.tar.gz
          mkdir -p /tmp/fanyi-source
          curl -L --fail --retry 3 \
            'https://codeload.github.com/dulo11/fanyireal-time/tar.gz/refs/heads/feature/browser-translator-v1.3-signed-update' \
            -o /tmp/fanyi-source.tar.gz
          tar -xzf /tmp/fanyi-source.tar.gz -C /tmp/fanyi-source --strip-components=1
          test -f /tmp/fanyi-source/browser-extension/manifest.json

      - name: Copy complete browser extension source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf browser-extension
          cp -a /tmp/fanyi-source/browser-extension ./browser-extension
          test -f browser-extension/manifest.json
          test -f browser-extension/background/main.js
          test -f browser-extension/content/content.js
          test -f browser-extension/popup/popup.html
          test -f browser-extension/options/options.html
          test -d browser-extension/tests
          test -f browser-extension/compat/firefox/manifest.json

      - name: Install standalone browser build workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cp /tmp/fanyi-source/.github/workflows/build-browser-extension.yml .github/workflows/build-browser-extension.yml
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-browser-extension.yml')
          s = p.read_text(encoding='utf-8')
          start = s.index('on:\n  push:\n    branches:')
          end = s.index('    paths:', start)
          s = s[:start] + "on:\n  push:\n    branches:\n      - main\n" + s[end:]
          s = s.replace('https://raw.githubusercontent.com/dulo11/fanyireal-time/extension-update-channel/updates.xml',
                        'https://raw.githubusercontent.com/dulo11/fanyireal-time/extension-update-channel/updates.xml')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add standalone repository README
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # 浮译 浏览器版

          这是浮译浏览器扩展的独立仓库。

          当前源码目录：`browser-extension/`

          当前迁移版本：v1.3.5。

          旧仓库 `dulo11/fanyireal-time` 继续保留作历史备份；后续浏览器版开发以本仓库为主。

          > 注意：本仓库目前为 Private。GitHub 私有仓库不能直接作为浏览器匿名 CRX 自动更新源，因此现阶段 ZIP/开发者模式安装最稳。固定扩展 ID 与签名配置仍保留在源码中；如需恢复公开 CRX 自动更新，可把更新通道放到公开仓库或 Cloudflare。
          EOF

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md browser-extension .github/workflows/build-browser-extension.yml
          if git diff --cached --quiet; then
            echo 'Nothing to migrate.'
          else
            git commit -m 'chore: migrate standalone browser extension from fanyireal-time'
            git push origin HEAD:main
          fi
