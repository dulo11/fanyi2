name: Build Browser Extension

on:
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - '.github/workflows/build-browser-extension.yml'
  pull_request:
    paths:
      - 'browser-extension/**'
      - '.github/workflows/build-browser-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-browser-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool browser-extension/manifest.json >/dev/null
          python -m json.tool browser-extension/compat/firefox/manifest.json >/dev/null
          VERSION="$(tr -d '[:space:]' < browser-extension/ZIP_VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find browser-extension -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
          for test in browser-extension/tests/*.test.cjs; do node "$test"; done

      - name: Build pure Chromium ZIP
        id: zipmeta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < browser-extension/ZIP_VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          rm -rf build/chromium-pure-zip dist
          mkdir -p dist
          python browser-extension/tools/build-pure-zip.py build/chromium-pure-zip
          (cd build/chromium-pure-zip && zip -qr "../../dist/FloatingTranslator-Chromium-v${VERSION}.zip" .)
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/chromium-pure-zip')
          m = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert m['version'] == Path('browser-extension/ZIP_VERSION').read_text().strip()
          assert m['background']['service_worker'] == 'background/main-zip.js'
          assert 'update_url' not in m
          js = m['content_scripts'][0]['js']
          assert js[:8] == [
              'compat/browser-api.js',
              'shared/language-core.js',
              'content/site-exclusions.js',
              'content/site-input-profile.js',
              'content/content.js',
              'content/v02-enhancements.js',
              'content/mixed-page-guard.js',
              'content/attribute-translator.js',
          ]
          assert 'content/floating-panel-simple.js' in js
          assert 'content/content-fast.js' not in js
          assert 'content/attribute-translator-lite.js' not in js
          assert m['content_scripts'][0]['all_frames'] is True
          assert m['content_scripts'][0]['match_about_blank'] is True
          assert (root/'compat/browser-api.js').exists()
          assert not (root/'background/page-injector.js').exists()
          PY
          sha256sum "dist/FloatingTranslator-Chromium-v${VERSION}.zip"

      - name: Build Firefox ZIP
        id: firefoxmeta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import json
          print(json.load(open('browser-extension/compat/firefox/manifest.json', encoding='utf-8'))['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          rm -rf build/firefox
          mkdir -p build/firefox dist
          cp -a browser-extension/. build/firefox/
          cp browser-extension/compat/firefox/manifest.json build/firefox/manifest.json
          rm -rf build/firefox/tests build/firefox/compat/firefox build/firefox/tools
          (cd build/firefox && zip -qr "../../dist/FloatingTranslator-Firefox-v${VERSION}.zip" .)

      - name: Upload Chromium ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-Chromium-v${{ steps.zipmeta.outputs.version }}
          path: dist/FloatingTranslator-Chromium-v${{ steps.zipmeta.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Firefox ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-Firefox-v${{ steps.firefoxmeta.outputs.version }}
          path: dist/FloatingTranslator-Firefox-v${{ steps.firefoxmeta.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
