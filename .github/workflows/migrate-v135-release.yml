name: Migrate v1.3.5 Signed Release

on:
  push:
    paths:
      - '.github/workflows/migrate-v135-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified v1.3.5 signed assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -L --fail --retry 3 \
            'https://github.com/dulo11/fanyireal-time/releases/download/browser-v1.3.5/FloatingTranslator-Chromium.crx' \
            -o dist/FloatingTranslator-Chromium.crx
          curl -L --fail --retry 3 \
            'https://github.com/dulo11/fanyireal-time/releases/download/browser-v1.3.5/FloatingTranslator-Chromium-v1.3.5.zip' \
            -o dist/FloatingTranslator-Chromium-v1.3.5.zip
          echo '14d63c388a31aa80011343be6f5c4c98cc80e5016428afbc541b3c6e3c71db76  dist/FloatingTranslator-Chromium.crx' | sha256sum -c -
          echo 'a541848153d00de951463f17c8f987cd14ac45695b2c3bca1511d1171278252b  dist/FloatingTranslator-Chromium-v1.3.5.zip' | sha256sum -c -

      - name: Generate fanyi2 update metadata
        shell: bash
        run: |
          cat > dist/updates.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">
            <app appid="hlfnagdelcpfdbpdeackdjelemaaoban">
              <updatecheck codebase="https://github.com/dulo11/fanyi2/releases/download/browser-v1.3.5/FloatingTranslator-Chromium.crx" version="1.3.5" />
            </app>
          </gupdate>
          XML
          (cd dist && sha256sum FloatingTranslator-Chromium.crx FloatingTranslator-Chromium-v1.3.5.zip > SHA256SUMS.txt)

      - name: Create fanyi2 v1.3.5 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dulo11/fanyi2
        shell: bash
        run: |
          set -euo pipefail
          if gh release view browser-v1.3.5 >/dev/null 2>&1; then
            gh release upload browser-v1.3.5 dist/FloatingTranslator-Chromium.crx dist/FloatingTranslator-Chromium-v1.3.5.zip dist/updates.xml dist/SHA256SUMS.txt --clobber
          else
            gh release create browser-v1.3.5 \
              dist/FloatingTranslator-Chromium.crx \
              dist/FloatingTranslator-Chromium-v1.3.5.zip \
              dist/updates.xml \
              dist/SHA256SUMS.txt \
              --title '浮译 浏览器版 v1.3.5' \
              --notes '从旧仓库迁移的固定签名 v1.3.5。Extension ID: hlfnagdelcpfdbpdeackdjelemaaoban'
          fi
