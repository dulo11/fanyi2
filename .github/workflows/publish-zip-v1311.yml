name: Publish Chromium ZIP v1.3.11

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-zip-v1311.yml'

permissions:
  contents: write

jobs:
  publish-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate page-first runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check browser-extension/content/content-fast.js
          node --check browser-extension/content/attribute-translator-lite.js
          node --check browser-extension/content/frame-performance-guard.js
          node --check browser-extension/background/main.js
          node browser-extension/tests/page-load-performance.test.cjs

      - name: Prepare v1.3.11 Chromium ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.3.11
          rm -rf build/chromium dist
          mkdir -p build/chromium dist
          cp -a browser-extension/. build/chromium/

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('build/chromium')
          path = root / 'manifest.json'
          manifest = json.loads(path.read_text(encoding='utf-8'))
          manifest['version'] = '1.3.11'
          manifest['description'] = '浮译浏览器版：页面优先性能模式、多引擎、多 Key 池、Google Web 兜底与持续网页翻译。'

          block = manifest['content_scripts'][0]
          block['js'] = [
              'content/content-fast.js' if item == 'content/content.js' else
              'content/attribute-translator-lite.js' if item == 'content/attribute-translator.js' else item
              for item in block['js']
          ]
          block['all_frames'] = False
          block['match_about_blank'] = False

          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -rf build/chromium/tests build/chromium/compat/firefox
          rm -f build/chromium/content/content.js build/chromium/content/attribute-translator.js

          python -m json.tool build/chromium/manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/chromium')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '1.3.11'
          block = manifest['content_scripts'][0]
          assert 'content/content-fast.js' in block['js']
          assert 'content/attribute-translator-lite.js' in block['js']
          assert 'content/content.js' not in block['js']
          assert 'content/attribute-translator.js' not in block['js']
          assert block.get('all_frames') is False
          assert block.get('match_about_blank') is False
          for rel in block['js'] + block.get('css', []):
              assert (root / rel).is_file(), rel
          PY

          cd build/chromium
          zip -r "../../dist/FloatingTranslator-Chromium-v${VERSION}.zip" . \
            -x '*.DS_Store' -x '*.git*'
          cd ../..
          sha256sum "dist/FloatingTranslator-Chromium-v${VERSION}.zip" > "dist/SHA256SUMS-v${VERSION}.txt"
          unzip -l "dist/FloatingTranslator-Chromium-v${VERSION}.zip" | head -80

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=browser-v1.3.11
          ZIP=dist/FloatingTranslator-Chromium-v1.3.11.zip
          SUM=dist/SHA256SUMS-v1.3.11.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SUM" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SUM" \
              --target "$GITHUB_SHA" \
              --title '浮译 浏览器版 v1.3.11（ZIP 页面优先版）' \
              --notes 'ZIP 专用性能修复：取消全队列布局排序；分片空闲扫描；属性翻译只做一次初始扫描；动态 DOM 合并后再扫；主页面优先，iframe 不再运行整套翻译器。'
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-Chromium-v1.3.11
          path: |
            dist/FloatingTranslator-Chromium-v1.3.11.zip
            dist/SHA256SUMS-v1.3.11.txt
          if-no-files-found: error
          retention-days: 30
