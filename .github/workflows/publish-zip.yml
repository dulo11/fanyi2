name: Publish Pure Chromium ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'browser-extension/ZIP_VERSION'
      - '.github/workflows/publish-zip.yml'

permissions:
  contents: write

jobs:
  publish-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and build
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < browser-extension/ZIP_VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node --check browser-extension/content/content.js
          node --check browser-extension/content/attribute-translator.js
          node --check browser-extension/content/floating-panel-simple.js
          node --check browser-extension/popup/popup-v12.js
          node --check browser-extension/background/main-zip.js
          node browser-extension/tests/v12-zip-regression.test.cjs
          rm -rf build/chromium-pure-zip dist
          mkdir -p dist
          python browser-extension/tools/build-pure-zip.py build/chromium-pure-zip
          (cd build/chromium-pure-zip && zip -qr "../../dist/FloatingTranslator-Chromium-v${VERSION}.zip" .)
          sha256sum "dist/FloatingTranslator-Chromium-v${VERSION}.zip" > "dist/SHA256SUMS-v${VERSION}.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          TAG="browser-v${VERSION}"
          ZIP="dist/FloatingTranslator-Chromium-v${VERSION}.zip"
          SUM="dist/SHA256SUMS-v${VERSION}.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SUM" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SUM" \
              --target "$GITHUB_SHA" \
              --title "浮译 浏览器版 v${VERSION}（纯 ZIP 版）" \
              --notes "Quetta/Chromium ZIP：回到 v1.2 已验证的完整 content.js / 原生 Promise 消息架构，并使用普通 DOM 悬浮小窗；不再使用 content-fast、storage RPC 或后台页面桥。"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTranslator-Chromium-v${{ steps.meta.outputs.version }}
          path: |
            dist/FloatingTranslator-Chromium-v${{ steps.meta.outputs.version }}.zip
            dist/SHA256SUMS-v${{ steps.meta.outputs.version }}.txt
          if-no-files-found: error
          retention-days: 30
