name: Publish Pure Chromium ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - 'browser-v*'

permissions:
  contents: write

jobs:
  publish-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and build
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < browser-extension/ZIP_VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node --check browser-extension/content/content.js
          node --check browser-extension/content/attribute-translator.js
          node --check browser-extension/content/floating-panel-simple.js
          node --check browser-extension/popup/popup.js
          node --check browser-extension/background/main-zip.js
          node --check browser-extension/background/page-injector.js
          node browser-extension/tests/v12-zip-regression.test.cjs
          node browser-extension/tests/v1319-stability.test.cjs
          rm -rf build/chromium-pure-zip dist
          mkdir -p dist
          python browser-extension/tools/build-pure-zip.py build/chromium-pure-zip
          (cd build/chromium-pure-zip && zip -qr "../../dist/FloatingTranslator-Chromium-v${VERSION}.zip" .)
          sha256sum "dist/FloatingTranslator-Chromium-v${VERSION}.zip" > "dist/SHA256SUMS-v${VERSION}.txt"

      - name: Validate official version/tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < browser-extension/ZIP_VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "browser-v$VERSION" || { echo "::error::Tag must be browser-v$VERSION"; exit 1; }
          else
            test "$GITHUB_REF" = 'refs/heads/main' || { echo "::error::Manual publication only from main"; exit 1; }
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.meta.outputs.version }}'
          TAG="browser-v${VERSION}"
          ZIP="dist/FloatingTranslator-Chromium-v${VERSION}.zip"
          SUM="dist/SHA256SUMS-v${VERSION}.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Version $TAG already published. Increase ZIP_VERSION before publishing."
            exit 1
          fi
          gh release create "$TAG" "$ZIP" "$SUM" \
            --target "$GITHUB_SHA" \
            --title "浮译 浏览器版 v${VERSION}（纯 ZIP 版）" \
            --notes "Quetta/Chromium 稳定增强版：保留 v1.2 正文主链和普通 DOM 悬浮窗；新增一键自检修复、网站独立配置、失败队列、引擎切换记录、LRU 容量缓存和 Stable/Beta 更新通道。"

