name: One-time Actions artifact cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-old-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preserve newest artifacts and delete only known older duplicates
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner, repo, per_page: 100});
            function policy(name) {
              if (/^FloatingTranslator-Chromium-v/.test(name)) return {group: name.includes('-beta-') ? 'chromium-beta' : 'chromium-stable', keep: 1};
              if (/^FloatingTranslator-Firefox-v/.test(name)) return {group: 'firefox', keep: 1};
              if (/^FloatingTranslator-Signed-Chromium-v/.test(name)) return {group: 'signed-crx', keep: 1};
              return null;
            }
            const groups = new Map();
            for (const a of artifacts) {
              if (a.expired) continue;
              const rule = policy(a.name);
              if (!rule) continue;
              if (!groups.has(rule.group)) groups.set(rule.group, {keep: rule.keep, items: []});
              groups.get(rule.group).items.push(a);
            }
            let deleted = 0, freed = 0, preserved = 0;
            for (const [group, entry] of groups) {
              entry.items.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
              console.log(group + ': found ' + entry.items.length + ', retaining newest ' + entry.keep);
              for (const a of entry.items.slice(0, entry.keep)) {
                console.log('KEEP ' + a.id + ' ' + a.name + ' ' + a.size_in_bytes);
                preserved++;
              }
              for (const a of entry.items.slice(entry.keep)) {
                try {
                  await github.rest.actions.deleteArtifact({owner, repo, artifact_id: a.id});
                  console.log('DELETED ' + a.id + ' ' + a.name + ' ' + a.size_in_bytes);
                  deleted++;
                  freed += a.size_in_bytes || 0;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                await new Promise(resolve => setTimeout(resolve, 200));
              }
            }
            console.log('SUMMARY total_artifacts=' + artifacts.length + ' deleted=' + deleted + ' kept=' + preserved + ' deleted_bytes=' + freed + ' unknown_names_untouched=true');
